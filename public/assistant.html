<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Audit Assistant — Audit Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-ink antialiased">

  <main class="ml-60 flex h-screen flex-col">

    <header class="border-b border-stone-200 bg-white/80 px-8 py-5 backdrop-blur">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="font-display text-2xl font-semibold">AI Audit Assistant</h1>
          <p class="mt-1 text-sm text-stone-500">
            Ask about logins, transactions, alerts, or a customer — in plain English.
          </p>
        </div>
        <span id="engine-badge" class="hidden rounded-full px-3 py-1 text-xs font-semibold ring-1"></span>
      </div>
    </header>

    <!-- conversation -->
    <div id="thread" class="flex-1 space-y-6 overflow-y-auto px-8 py-6"></div>

    <!-- composer -->
    <div class="border-t border-stone-200 bg-white px-8 py-4">
      <form id="ask-form" class="mx-auto flex max-w-3xl items-end gap-3">
        <textarea id="question" rows="1" required
          placeholder="e.g. Show all high-risk withdrawals this week"
          class="max-h-32 flex-1 resize-none rounded-xl border border-stone-300 bg-white px-4 py-3 text-sm
                 outline-none transition focus:border-forest-700 focus:ring-2 focus:ring-forest-700/15"></textarea>
        <button type="submit" id="ask-btn"
          class="rounded-xl bg-forest-800 px-5 py-3 text-sm font-semibold text-white shadow-sm
                 transition hover:bg-forest-900 disabled:opacity-50">
          Ask
        </button>
      </form>
      <p class="mx-auto mt-2 max-w-3xl text-[11px] text-stone-400">
        The assistant is read-only — it can look at the audit data but never change it. Every question you ask is logged.
      </p>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    const thread = document.getElementById('thread');
    const form = document.getElementById('ask-form');
    const input = document.getElementById('question');

    async function init() {
      const user = await mountShell('/assistant.html', ['auditor', 'admin']);
      if (!user) return;

      const { claude_enabled, suggestions } = await API.get('assistant.php?action=config');

      const badge = document.getElementById('engine-badge');
      badge.classList.remove('hidden');
      badge.textContent = claude_enabled ? 'Powered by Claude' : 'Built-in engine';
      badge.className = 'rounded-full px-3 py-1 text-xs font-semibold ring-1 '
        + (claude_enabled ? 'bg-forest-50 text-forest-800 ring-forest-200'
                          : 'bg-stone-100 text-stone-600 ring-stone-200');

      greeting(claude_enabled, suggestions);
    }

    function greeting(claudeEnabled, suggestions) {
      const chips = suggestions.map((s) => `
        <button class="suggestion rounded-full border border-stone-300 bg-white px-3 py-1.5 text-xs
                       text-stone-700 transition hover:border-forest-700 hover:text-forest-800">${esc(s)}</button>`).join('');

      thread.insertAdjacentHTML('beforeend', `
        <div class="mx-auto max-w-3xl">
          <div class="rounded-2xl border border-stone-200 bg-white p-5">
            <p class="text-sm text-stone-700">
              Hi — I can answer questions about everything the Demo Bank has recorded.
              ${claudeEnabled
                ? 'Claude is connected, so you can phrase questions however you like.'
                : 'I\'m running the built-in engine, so stick close to the examples below.'}
            </p>
            <div class="mt-4 flex flex-wrap gap-2">${chips}</div>
          </div>
        </div>`);

      thread.querySelectorAll('.suggestion').forEach((b) =>
        b.addEventListener('click', () => submit(b.textContent)));
    }

    // ---- rendering a turn

    function addQuestion(text) {
      thread.insertAdjacentHTML('beforeend', `
        <div class="mx-auto flex max-w-3xl justify-end">
          <div class="max-w-[80%] rounded-2xl rounded-br-sm bg-forest-800 px-4 py-2.5 text-sm text-white">
            ${esc(text)}
          </div>
        </div>`);
      scroll();
    }

    function addThinking() {
      const id = 'think-' + Date.now();
      thread.insertAdjacentHTML('beforeend', `
        <div id="${id}" class="mx-auto max-w-3xl">
          <div class="inline-flex items-center gap-2 rounded-2xl rounded-bl-sm border border-stone-200 bg-white px-4 py-2.5 text-sm text-stone-400">
            <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-stone-200 border-t-forest-700"></span>
            Looking through the audit log…
          </div>
        </div>`);
      scroll();
      return id;
    }

    function addAnswer(result) {
      const table = result.rows && result.rows.length ? buildTable(result.rows) : '';
      const empty = (!result.rows || !result.rows.length)
        ? `<p class="mt-1 text-xs text-stone-400">No matching records.</p>` : '';
      const note = result.fallback_note
        ? `<p class="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-800 ring-1 ring-amber-200">${esc(result.fallback_note)}</p>` : '';
      const sql = result.sql
        ? `<details class="mt-3"><summary class="cursor-pointer text-xs font-medium text-stone-400 hover:text-stone-600">Show the query that ran</summary>
             <pre class="mt-2 overflow-x-auto rounded-lg bg-stone-900 p-3 text-[11px] leading-relaxed text-stone-100">${esc(result.sql)}</pre></details>` : '';
      const chips = result.suggestions
        ? `<div class="mt-3 flex flex-wrap gap-2">${result.suggestions.map((s) =>
             `<button class="suggestion rounded-full border border-stone-300 bg-white px-3 py-1.5 text-xs text-stone-700 transition hover:border-forest-700 hover:text-forest-800">${esc(s)}</button>`).join('')}</div>` : '';

      thread.insertAdjacentHTML('beforeend', `
        <div class="mx-auto max-w-3xl">
          <div class="rounded-2xl rounded-bl-sm border border-stone-200 bg-white p-5">
            <div class="mb-2 flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wide text-stone-400">
              <span>${esc(result.interpretation || 'Answer')}</span>
              <span class="rounded-full bg-stone-100 px-2 py-0.5 text-stone-500">
                ${result.engine === 'claude' ? 'Claude' : 'built-in'}
              </span>
            </div>
            <p class="text-sm leading-relaxed text-ink">${esc(result.answer)}</p>
            ${empty}${table}${sql}${note}${chips}
          </div>
        </div>`);

      thread.querySelectorAll('.suggestion').forEach((b) =>
        b.addEventListener('click', () => submit(b.textContent)));
      scroll();
    }

    /** Render rows (array of objects) as a compact table. */
    function buildTable(rows) {
      const cols = Object.keys(rows[0]);
      const head = cols.map((c) => `<th class="whitespace-nowrap px-3 py-2 text-left font-semibold text-stone-500">${esc(fmt.label(c))}</th>`).join('');
      const body = rows.map((r) => `
        <tr class="border-t border-stone-100">
          ${cols.map((c) => `<td class="whitespace-nowrap px-3 py-2 text-stone-700">${cell(c, r[c])}</td>`).join('')}
        </tr>`).join('');
      return `
        <div class="mt-4 overflow-x-auto rounded-xl border border-stone-200">
          <table class="min-w-full text-xs">
            <thead class="bg-stone-50">${head}</thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    /** Format a cell by its column name — money, risk badges, dates read better. */
    function cell(col, value) {
      if (value === null || value === undefined || value === '') return '<span class="text-stone-300">—</span>';
      if (/risk_level/.test(col)) return riskBadge(String(value));
      if (/^status$/.test(col)) return statusBadge(String(value));
      if (/(amount|balance|total|value)/.test(col)) return esc(fmt.money(value));
      if (/(created_at|last_|_at|timestamp)/.test(col)) return esc(fmt.dateTime(value));
      if (/event_type|type/.test(col)) return esc(fmt.label(value));
      return esc(String(value));
    }

    // ---- submit

    async function submit(text) {
      const question = (text ?? input.value).trim();
      if (!question) return;
      input.value = '';
      autosize();

      addQuestion(question);
      const thinkingId = addThinking();
      document.getElementById('ask-btn').disabled = true;

      try {
        const result = await API.post('assistant.php?action=ask', { question });
        document.getElementById(thinkingId)?.remove();
        addAnswer(result);
      } catch (err) {
        document.getElementById(thinkingId)?.remove();
        addAnswer({ engine: 'built-in', interpretation: 'Error', answer: err.message, rows: [] });
      } finally {
        document.getElementById('ask-btn').disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });

    // Enter to send, Shift+Enter for newline; grow the textarea with content.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    });
    input.addEventListener('input', autosize);
    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 128) + 'px';
    }

    function scroll() { thread.scrollTop = thread.scrollHeight; }

    init();
  </script>
</body>
</html>
