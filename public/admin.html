<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration — Audit Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-ink antialiased">

  <main class="ml-60 p-8">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Administration</h1>
    </header>

    <div class="mb-6 flex gap-2" id="tabs"></div>
    <div id="content"></div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/assistant-widget.js"></script>
  <script src="/assets/js/password-toggle.js"></script>
  <script>
    const content = document.getElementById('content');
    const TABS = [
      ['users', 'Users'],
      ['security', 'Security'],
      ['rules', 'Risk thresholds'],
      ['health', 'System health'],
    ];
    let tab = 'users';

    async function init() {
      const user = await mountShell('/admin.html', ['admin']);
      if (!user) return;

      renderTabs();
      await load();
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map(([key, label]) => {
        const active = key === tab;
        return `<button data-tab="${key}"
                        class="tab rounded-lg px-3 py-1.5 text-sm font-medium transition
                               ${active
                                 ? 'bg-forest-50 text-forest-800 ring-1 ring-forest-200'
                                 : 'text-stone-600 ring-1 ring-stone-200 hover:bg-stone-100 hover:text-ink'}">
                  ${label}
                </button>`;
      }).join('');

      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => {
          tab = button.dataset.tab;
          renderTabs();
          load();
        });
      });
    }

    async function load() {
      loading(content);
      if (tab === 'users') return renderUsers();
      if (tab === 'security') return renderSecurity();
      if (tab === 'rules') return renderRules();
      if (tab === 'health') return renderHealth();
    }


    async function renderUsers() {
      const { users } = await API.get('admin.php?action=users');

      content.innerHTML = `
        <div class="mb-4 flex justify-end">
          <button id="new-user" class="rounded-lg bg-forest-800 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-forest-900">
            + New user
          </button>
        </div>

        <div class="overflow-hidden rounded-xl border border-stone-200 bg-white">
          <table class="w-full text-sm">
            <thead class="border-b border-stone-200 bg-stone-50 text-left text-xs uppercase tracking-wide text-stone-500">
              <tr>
                <th class="px-4 py-3 font-medium">User</th>
                <th class="px-4 py-3 font-medium">Role</th>
                <th class="px-4 py-3 font-medium">Status</th>
                <th class="px-4 py-3 font-medium text-right">Balance</th>
                <th class="px-4 py-3 font-medium text-right">Risk</th>
                <th class="px-4 py-3 font-medium">Last login</th>
                <th class="px-4 py-3 font-medium text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-stone-200">
              ${users.map(userRow).join('')}
            </tbody>
          </table>
        </div>`;

      document.getElementById('new-user').addEventListener('click', showNewUserForm);

      document.querySelectorAll('[data-unlock]').forEach((b) =>
        b.addEventListener('click', () => updateUser(b.dataset.unlock, { status: 'active' }, 'Account unlocked.')));

      document.querySelectorAll('[data-lock]').forEach((b) =>
        b.addEventListener('click', () => updateUser(b.dataset.lock, { status: 'locked' }, 'Account locked.')));

      document.querySelectorAll('[data-delete]').forEach((b) =>
        b.addEventListener('click', () => deleteUser(b.dataset.delete, b.dataset.username)));
    }

    function userRow(u) {
      const risk = Number(u.risk_score);
      const riskTone = risk >= 95 ? 'text-rose-600' : risk >= 70 ? 'text-orange-600'
                     : risk >= 40 ? 'text-gold-600' : 'text-forest-700';

      return `
        <tr class="transition hover:bg-stone-50">
          <td class="px-4 py-3">
            <p class="font-medium text-ink">${esc(u.full_name)}</p>
            <p class="text-xs text-stone-400">@${esc(u.username)} · ${esc(u.email)}</p>
          </td>
          <td class="px-4 py-3">
            <span class="rounded-full bg-stone-100 px-2 py-0.5 text-xs capitalize text-stone-600">${u.role}</span>
          </td>
          <td class="px-4 py-3">${statusBadge(u.status)}</td>
          <td class="px-4 py-3 text-right text-stone-700">${u.role === 'customer' ? fmt.money(u.total_balance) : '—'}</td>
          <td class="px-4 py-3 text-right">
            <span class="font-semibold ${riskTone}">${risk}</span>
          </td>
          <td class="px-4 py-3 text-xs text-stone-500">${u.last_login_at ? fmt.ago(u.last_login_at) : 'never'}</td>
          <td class="px-4 py-3">
            <div class="flex justify-end gap-1.5">
              ${u.role === 'customer'
                ? `<a href="/timeline.html?user=${u.id}"
                      class="rounded-md px-2 py-1 text-xs text-forest-700 transition hover:bg-stone-100">Timeline</a>` : ''}
              ${u.status === 'locked'
                ? `<button data-unlock="${u.id}"
                           class="rounded-md px-2 py-1 text-xs text-emerald-400 transition hover:bg-stone-100">Unlock</button>`
                : `<button data-lock="${u.id}"
                           class="rounded-md px-2 py-1 text-xs text-amber-400 transition hover:bg-stone-100">Lock</button>`}
              <button data-delete="${u.id}" data-username="${esc(u.username)}"
                      class="rounded-md px-2 py-1 text-xs text-rose-400 transition hover:bg-stone-100">Delete</button>
            </div>
          </td>
        </tr>`;
    }

    async function updateUser(id, changes, message) {
      try {
        await API.patch('admin.php?action=user', changes, { id });
        toast(message, 'success');
        await load();
      } catch (error) {
        toast(esc(error.message), 'error');
      }
    }

    async function deleteUser(id, username) {
      // Deleting is irreversible, so make them mean it.
      if (!confirm(`Delete "${username}"?\n\nTheir accounts and transactions go with them. The audit trail of what they did survives.`)) {
        return;
      }

      try {
        await API.del('admin.php?action=user', { id });
        toast('User deleted. A CRITICAL audit event was recorded.', 'alert');
        await load();
      } catch (error) {
        toast(esc(error.message), 'error');
      }
    }

    function showNewUserForm() {
      const html = `
        <div id="modal" class="fixed inset-0 z-40 flex items-center justify-center p-6">
          <div class="absolute inset-0 bg-stone-900/40" id="modal-backdrop"></div>
          <form id="user-form" class="relative w-full max-w-sm space-y-3 rounded-2xl border border-stone-200 bg-white p-6 shadow-2xl">
            <h2 class="text-lg font-bold">New user</h2>
            <input id="n-full_name" required placeholder="Full name" class="${INPUT}" />
            <input id="n-username" required placeholder="Username" class="${INPUT}" />
            <input id="n-email" type="email" required placeholder="Email" class="${INPUT}" />
            <input id="n-phone" placeholder="Phone (optional)" class="${INPUT}" />
            <input id="n-password" type="password" required placeholder="Password (8+ characters)" class="${INPUT}" />
            <select id="n-role" class="${INPUT}">
              <option value="customer">Customer</option>
              <option value="auditor">Auditor</option>
              <option value="admin">Administrator</option>
            </select>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 rounded-lg bg-forest-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-forest-900">
                Create
              </button>
              <button type="button" id="modal-cancel"
                      class="rounded-lg border border-stone-300 px-4 py-2 text-sm text-stone-600 transition hover:bg-stone-100">
                Cancel
              </button>
            </div>
          </form>
        </div>`;

      document.body.insertAdjacentHTML('beforeend', html);

      const close = () => document.getElementById('modal').remove();
      document.getElementById('modal-cancel').addEventListener('click', close);
      document.getElementById('modal-backdrop').addEventListener('click', close);

      document.getElementById('user-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await API.post('admin.php?action=users', {
            full_name: document.getElementById('n-full_name').value.trim(),
            username: document.getElementById('n-username').value.trim(),
            email: document.getElementById('n-email').value.trim(),
            phone: document.getElementById('n-phone').value.trim(),
            password: document.getElementById('n-password').value,
            role: document.getElementById('n-role').value,
          });
          close();
          toast('User created.', 'success');
          await load();
        } catch (error) {
          toast(esc(error.message), 'error');
        }
      });
    }

    const INPUT = 'w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm ' +
                  'placeholder-stone-400 outline-none focus:border-forest-700 focus:ring-1 focus:ring-forest-700';

    // ------------------------------------------------------------------ rules

    async function renderRules() {
      const { rules } = await API.get('admin.php?action=rules');

      content.innerHTML = `
        <div class="space-y-3">
          ${rules.map(ruleCard).join('')}
        </div>`;

      document.querySelectorAll('form[data-rule]').forEach((form) => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const key = form.dataset.rule;
          const value = form.querySelector('input').value;

          try {
            await API.patch('admin.php?action=rule', { value }, { key });
            toast('Threshold updated. The change was logged.', 'success');
            await load();
          } catch (error) {
            toast(esc(error.message), 'error');
          }
        });
      });
    }

    function ruleCard(r) {
      return `
        <form data-rule="${r.rule_key}" class="flex items-center gap-4 rounded-xl border border-stone-200 bg-white p-4">
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-ink">${esc(r.label)}</p>
            <p class="mt-0.5 text-xs text-stone-500">${esc(r.description)}</p>
            <p class="mt-1 font-mono text-[11px] text-stone-300">${r.rule_key}</p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <input type="number" step="any" min="0" value="${Number(r.value)}"
                   class="w-32 rounded-lg border border-stone-300 bg-white px-3 py-2 text-right text-sm outline-none focus:border-forest-700 focus:ring-1 focus:ring-forest-700" />
            <span class="w-16 text-xs text-stone-500">${esc(r.unit || '')}</span>
            <button type="submit"
                    class="rounded-lg bg-stone-100 px-3 py-2 text-sm font-medium text-ink transition hover:bg-stone-200">
              Save
            </button>
          </div>
        </form>`;
    }

    // --------------------------------------------------------------- security

    async function renderSecurity() {
      const s = await API.get('admin.php?action=security');
      const t = s.thresholds;

      const empty = (msg) => `<p class="px-5 py-6 text-sm text-stone-400">${msg}</p>`;

      // Accounts the transaction-limit controls have frozen.
      const restricted = !s.restricted_accounts.length
        ? empty('No accounts are currently restricted.')
        : `<table class="w-full text-sm">
             <thead class="text-left text-xs uppercase tracking-wide text-stone-400">
               <tr class="border-b border-stone-200">
                 <th class="px-5 py-2.5">Account</th>
                 <th class="px-5 py-2.5">Customer</th>
                 <th class="px-5 py-2.5">Reason</th>
                 <th class="px-5 py-2.5 text-right">Balance</th>
                 <th class="px-5 py-2.5 text-right">Action</th>
               </tr>
             </thead>
             <tbody>
               ${s.restricted_accounts.map((a) => `
                 <tr class="border-b border-stone-100">
                   <td class="px-5 py-3 font-medium text-ink">${esc(a.account_number)}
                     <span class="text-stone-400">· ${esc(a.type)}</span></td>
                   <td class="px-5 py-3 text-stone-700">${esc(a.full_name)}
                     <span class="text-stone-400">@${esc(a.username)}</span></td>
                   <td class="px-5 py-3 text-stone-600">
                     ${a.limit_violation_count} limit violation${a.limit_violation_count == 1 ? '' : 's'}
                   </td>
                   <td class="px-5 py-3 text-right text-stone-700">${fmt.money(a.balance)}</td>
                   <td class="px-5 py-3 text-right">
                     <button data-activate-account="${a.id}"
                       class="rounded-lg bg-forest-800 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-forest-900">
                       Activate
                     </button>
                   </td>
                 </tr>`).join('')}
             </tbody>
           </table>`;

      // Logins the brute-force controls have shut.
      const locked = !s.locked_users.length
        ? empty('No accounts are locked.')
        : `<table class="w-full text-sm">
             <thead class="text-left text-xs uppercase tracking-wide text-stone-400">
               <tr class="border-b border-stone-200">
                 <th class="px-5 py-2.5">Account</th>
                 <th class="px-5 py-2.5">Issue</th>
                 <th class="px-5 py-2.5">Status</th>
                 <th class="px-5 py-2.5 text-right">Action</th>
               </tr>
             </thead>
             <tbody>
               ${s.locked_users.map((u) => {
                 const permanent = u.status === 'brute_force_locked';
                 return `
                 <tr class="border-b border-stone-100">
                   <td class="px-5 py-3 text-stone-700">${esc(u.full_name)}
                     <span class="text-stone-400">@${esc(u.username)}</span></td>
                   <td class="px-5 py-3 text-stone-600">
                     ${permanent
                       ? `Continued failures after a warning · lockout history: ${u.lockout_count}`
                       : `${u.failed_logins} failed login${u.failed_logins == 1 ? '' : 's'}`}
                   </td>
                   <td class="px-5 py-3">
                     ${permanent
                       ? `<span class="inline-flex rounded-full bg-rose-50 px-2 py-0.5 text-[11px] font-bold text-rose-700 ring-1 ring-rose-200">SECURITY LOCK</span>`
                       : Number(u.lock_active)
                         ? `<span class="inline-flex rounded-full bg-gold-50 px-2 py-0.5 text-[11px] font-bold text-gold-600 ring-1 ring-gold-100">TEMPORARY</span>`
                         : `<span class="inline-flex rounded-full bg-stone-100 px-2 py-0.5 text-[11px] font-semibold text-stone-600 ring-1 ring-stone-200">EXPIRED</span>`}
                   </td>
                   <td class="px-5 py-3 text-right">
                     <button data-unlock-user="${u.id}"
                       class="rounded-lg bg-forest-800 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-forest-900">
                       Activate
                     </button>
                   </td>
                 </tr>`;
               }).join('')}
             </tbody>
           </table>`;

      // Active accounts that have been locked out before, and so are held to the
      // shorter post-lockout threshold until an admin clears the warning.
      const warned = !(s.warned_users || []).length
        ? ''
        : `<section class="overflow-hidden rounded-xl border border-gold-100 bg-white">
             <h2 class="border-b border-stone-200 px-5 py-3 text-sm font-semibold text-ink">
               Accounts on warning
               <span class="ml-1 text-stone-400">(${s.warned_users.length})</span>
             </h2>
             <p class="border-b border-stone-100 bg-gold-50/40 px-5 py-2 text-xs text-stone-600">
               These accounts can log in, but have been locked out before — a further
               ${s.thresholds.post_lockout_failures} failures will secure them permanently.
             </p>
             <table class="w-full text-sm">
               <tbody>
                 ${s.warned_users.map((u) => `
                   <tr class="border-b border-stone-100">
                     <td class="px-5 py-3 text-stone-700">${esc(u.full_name)}
                       <span class="text-stone-400">@${esc(u.username)}</span></td>
                     <td class="px-5 py-3 text-stone-600">Lockout history: ${u.lockout_count}</td>
                     <td class="px-5 py-3 text-right">
                       <button data-unlock-user="${u.id}"
                         class="rounded-lg border border-stone-300 px-3 py-1.5 text-xs font-semibold text-stone-700 transition hover:border-forest-700 hover:text-forest-800">
                         Clear warning
                       </button>
                     </td>
                   </tr>`).join('')}
               </tbody>
             </table>
           </section>`;

      const flags = !s.open_flags.length
        ? empty('No open security flags.')
        : `<dl class="divide-y divide-stone-100">
             ${s.open_flags.map((f) => `
               <div class="flex items-start justify-between gap-4 px-5 py-3">
                 <div class="min-w-0">
                   <div class="flex items-center gap-2">
                     ${riskBadge(f.severity)}
                     <code class="text-xs text-stone-500">${esc(f.flag_ref)}</code>
                     <span class="text-xs font-semibold text-stone-600">${esc(fmt.label(f.flag_type))}</span>
                   </div>
                   <p class="mt-1 text-sm leading-relaxed text-stone-600">${esc(f.description)}</p>
                 </div>
                 <span class="shrink-0 text-xs text-stone-400">${fmt.ago(f.created_at)}</span>
               </div>`).join('')}
           </dl>`;

      const attempts = !s.recent_attempts.length
        ? empty('No login attempts recorded yet.')
        : `<dl class="divide-y divide-stone-100">
             ${s.recent_attempts.map((a) => `
               <div class="flex items-center justify-between gap-4 px-5 py-2.5 text-sm">
                 <div class="min-w-0 truncate">
                   <span class="${a.status === 'SUCCESS' ? 'text-forest-700' : 'text-rose-600'}">●</span>
                   <span class="ml-1 font-medium text-stone-700">${esc(a.username || '—')}</span>
                   <span class="ml-2 text-stone-400">${esc(a.ip_address || '')}</span>
                   ${a.reason ? `<span class="ml-2 text-xs text-stone-400">${esc(fmt.label(a.reason))}</span>` : ''}
                 </div>
                 <span class="shrink-0 text-xs text-stone-400">${fmt.ago(a.created_at)}</span>
               </div>`).join('')}
           </dl>`;

      content.innerHTML = `
        <p class="mb-5 text-sm text-stone-500">
          Daily limit is ${t.daily_limit_percent}% of balance · accounts restrict after
          ${t.violations_allowed} violations · ${t.max_failed_logins} failed logins lock an account
          for ${t.lockout_minutes} min · ${t.post_lockout_failures} further failures secure it permanently.
        </p>

        <div class="space-y-6">
          <section class="overflow-hidden rounded-xl border border-stone-200 bg-white">
            <h2 class="border-b border-stone-200 px-5 py-3 text-sm font-semibold text-ink">
              Restricted accounts
              <span class="ml-1 text-stone-400">(${s.restricted_accounts.length})</span>
            </h2>
            ${restricted}
          </section>

          <section class="overflow-hidden rounded-xl border border-stone-200 bg-white">
            <h2 class="border-b border-stone-200 px-5 py-3 text-sm font-semibold text-ink">
              Locked logins
              <span class="ml-1 text-stone-400">(${s.locked_users.length})</span>
            </h2>
            ${locked}
          </section>

          ${warned}

          <div class="grid gap-6 lg:grid-cols-2">
            <section class="overflow-hidden rounded-xl border border-stone-200 bg-white">
              <h2 class="border-b border-stone-200 px-5 py-3 text-sm font-semibold text-ink">
                Open security flags
                <span class="ml-1 text-stone-400">(${s.open_flags.length})</span>
              </h2>
              ${flags}
            </section>

            <section class="overflow-hidden rounded-xl border border-stone-200 bg-white">
              <h2 class="border-b border-stone-200 px-5 py-3 text-sm font-semibold text-ink">Recent login attempts</h2>
              ${attempts}
            </section>
          </div>
        </div>`;

      document.querySelectorAll('[data-activate-account]').forEach((button) => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const r = await API.post('admin.php?action=activate-account', {}, { id: button.dataset.activateAccount });
            toast(r.message, 'success');
            renderSecurity();
          } catch (err) {
            toast(err.message, 'error');
            button.disabled = false;
          }
        });
      });

      document.querySelectorAll('[data-unlock-user]').forEach((button) => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const r = await API.post('admin.php?action=unlock-user', {}, { id: button.dataset.unlockUser });
            toast(r.message, 'success');
            renderSecurity();
          } catch (err) {
            toast(err.message, 'error');
            button.disabled = false;
          }
        });
      });
    }

    // ----------------------------------------------------------------- health

    async function renderHealth() {
      const [h, a] = await Promise.all([
        API.get('admin.php?action=health'),
        API.get('admin.php?action=analytics'),
      ]);

      content.innerHTML = `
        <div class="grid gap-6 lg:grid-cols-2">

          <section class="rounded-xl border border-stone-200 bg-white p-5 lg:col-span-2">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <h2 class="text-sm font-semibold text-ink">Audit log integrity</h2>
              <button id="verify-integrity"
                class="shrink-0 rounded-lg bg-forest-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-forest-900 disabled:opacity-60">
                Verify integrity
              </button>
            </div>
            <div id="integrity-result" class="mt-4 text-sm text-stone-400">Not checked yet.</div>
          </section>

          <section class="rounded-xl border border-stone-200 bg-white p-5">
            <h2 class="mb-4 text-sm font-semibold text-ink">System health</h2>
            <dl class="space-y-0 divide-y divide-stone-200 text-sm">
              ${row('Database', `<span class="text-emerald-400">● ${h.database.status}</span>`)}
              ${row('Engine', esc(h.database.engine))}
              ${row('Version', esc(h.database.version))}
              ${row('Database size', (h.database.size_bytes / 1024).toFixed(0) + ' KB')}
              ${row('PHP', esc(h.server.php_version))}
              ${row('Memory', h.server.memory_mb + ' MB')}
              ${row('Active sessions', fmt.number(h.active_sessions))}
            </dl>
          </section>

          <section class="rounded-xl border border-stone-200 bg-white p-5">
            <h2 class="mb-4 text-sm font-semibold text-ink">Table sizes</h2>
            <dl class="space-y-0 divide-y divide-stone-200 text-sm">
              ${Object.entries(h.tables).map(([table, count]) =>
                row(fmt.label(table), fmt.number(count))).join('')}
            </dl>
          </section>

          <section class="rounded-xl border border-stone-200 bg-white p-5">
            <h2 class="mb-4 text-sm font-semibold text-ink">Money moved</h2>
            <dl class="space-y-0 divide-y divide-stone-200 text-sm">
              ${row('Deposits', fmt.money(a.totals.deposits))}
              ${row('Withdrawals', fmt.money(a.totals.withdrawals))}
              ${row('Transfers', fmt.money(a.totals.transfers))}
            </dl>
          </section>

          <section class="rounded-xl border border-stone-200 bg-white p-5">
            <h2 class="mb-4 text-sm font-semibold text-ink">Which rules are firing</h2>
            ${a.alerts_by_rule.length === 0
              ? `<p class="text-sm text-stone-400">No alerts raised yet.</p>`
              : `<dl class="space-y-0 divide-y divide-stone-200 text-sm">
                   ${a.alerts_by_rule.map((r) => row(
                     `<code class="text-xs">${r.rule_key}</code>`,
                     `${r.count} raised · <span class="text-stone-500">${r.false_positives} false</span>`,
                   )).join('')}
                 </dl>`}
          </section>
        </div>`;

      document.getElementById('verify-integrity').addEventListener('click', runIntegrityCheck);
    }

    async function runIntegrityCheck() {
      const box = document.getElementById('integrity-result');
      const btn = document.getElementById('verify-integrity');
      btn.disabled = true;
      box.className = 'mt-4 text-sm text-stone-400';
      box.textContent = 'Verifying…';

      try {
        const r = await API.get('admin.php?action=integrity');
        box.className = 'mt-4';

        if (r.ok) {
          box.innerHTML = `
            <div class="flex items-center gap-2 rounded-lg bg-forest-50 px-4 py-3 text-sm ring-1 ring-forest-200">
              <span class="text-forest-600">●</span>
              <span class="font-semibold text-forest-800">Chain intact</span>
              <span class="text-forest-700/70">— ${fmt.number(r.checked)} events verified</span>
            </div>`;
        } else {
          const b = r.first_broken || {};
          box.innerHTML = `
            <div class="rounded-lg bg-rose-50 px-4 py-3 text-sm ring-1 ring-rose-200">
              <div class="flex items-center gap-2 font-semibold text-rose-700">
                <span>●</span> Tampering detected at ${esc(b.audit_ref || '—')}
              </div>
              <p class="mt-1 text-rose-700/80">
                ${esc(b.reason || '')} ${fmt.number(r.checked)} events verified before the break.
              </p>
            </div>`;
        }
      } catch (err) {
        box.className = 'mt-4 text-sm text-rose-600';
        box.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function row(label, value) {
      return `
        <div class="flex justify-between gap-4 py-2.5">
          <dt class="text-stone-500">${label}</dt>
          <dd class="text-right text-stone-700">${value}</dd>
        </div>`;
    }

    init();
  </script>
</body>
</html>
