<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Audit Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-ink antialiased">

  <main class="ml-60 p-8">
    <header class="mb-8 flex items-end justify-between">
      <div>
        <h1 class="text-2xl font-bold">Audit Dashboard</h1>
      </div>
      <button id="refresh"
              class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm text-stone-600 transition hover:bg-stone-100 hover:text-ink">
        Refresh
      </button>
    </header>

    <div id="content"></div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/assistant-widget.js"></script>
  <script>
    const content = document.getElementById('content');
    const charts = [];

    async function init() {
      const user = await mountShell('/dashboard.html', ['auditor', 'admin']);
      if (!user) return;

      document.getElementById('refresh').addEventListener('click', load);
      await load();
    }

    async function load() {
      loading(content, 'Loading audit data…');

      // Charts must be destroyed before their canvases are thrown away.
      charts.forEach((c) => c.destroy());
      charts.length = 0;

      const data = await API.get('audit.php?action=dashboard');
      render(data);
    }

    function render(d) {
      const k = d.kpis;

      content.innerHTML = `
        <!-- KPI tiles -->
        <section class="mb-8 grid grid-cols-2 gap-4 md:grid-cols-4">
          ${kpi('Total customers', fmt.number(k.total_users), 'neutral')}
          ${kpi('Active today', fmt.number(k.active_today), 'neutral')}
          ${kpi('Logins today', fmt.number(k.logins_today), 'neutral')}
          ${kpi('Failed logins', fmt.number(k.failed_logins_today), k.failed_logins_today > 0 ? 'watch' : 'neutral')}
          ${kpi('Transactions today', fmt.number(k.transactions_today), 'neutral')}
          ${kpi('Flagged transactions', fmt.number(k.flagged_transactions), k.flagged_transactions > 0 ? 'warn' : 'neutral')}
          ${kpi('Critical alerts open', fmt.number(k.critical_open), k.critical_open > 0 ? 'bad' : 'good', '/alerts.html?risk=CRITICAL')}
          ${kpi('Pending reviews', fmt.number(k.pending_reviews), k.pending_reviews > 0 ? 'pending' : 'neutral', '/alerts.html')}
        </section>

        <section class="mb-8 grid gap-4 md:grid-cols-3">
          ${kpi('Locked accounts', fmt.number(k.locked_accounts), k.locked_accounts > 0 ? 'bad' : 'neutral')}
          ${kpi('Total transferred', fmt.money(k.total_transferred), 'neutral')}
          ${kpi('Audit events recorded', fmt.number(k.total_audits), 'neutral', '/audits.html')}
        </section>

        <!-- Risk summary -->
        <section class="mb-8">
          <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-stone-500">Risk summary</h2>
          <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
            ${riskTile('CRITICAL', d.risk_summary.CRITICAL)}
            ${riskTile('HIGH', d.risk_summary.HIGH)}
            ${riskTile('MEDIUM', d.risk_summary.MEDIUM)}
            ${riskTile('LOW', d.risk_summary.LOW)}
          </div>
        </section>

        <!-- Charts -->
        <section class="mb-8 grid gap-6 lg:grid-cols-2">
          ${panel('Login activity (14 days)', '<canvas id="chart-logins" height="120"></canvas>')}
          ${panel('Transaction volume (14 days)', '<canvas id="chart-volume" height="120"></canvas>')}
          ${panel('Events by compliance category', '<canvas id="chart-category" height="140"></canvas>')}
          ${panel('Transactions by type', '<canvas id="chart-types" height="140"></canvas>')}
        </section>

        <!-- Feed + top users -->
        <section class="grid gap-6 lg:grid-cols-2">
          ${panel('Live activity feed', `
            <div class="-mx-5 -mb-5 max-h-96 divide-y divide-stone-200 overflow-y-auto">
              ${d.recent_feed.map(feedRow).join('')}
            </div>`)}

          ${panel('Most active customers', `
            <div class="space-y-1">
              ${d.top_active_users.map(userRow).join('')}
            </div>`)}
        </section>`;

      drawCharts(d);
    }

    // ------------------------------------------------------------ components

    // On a light page a number only needs colour when it means something.
    // Neutral counts stay ink; anything a reader should react to gets a hue.
    const TONE = {
      neutral:  'text-ink',
      good:     'text-forest-700',
      watch:    'text-gold-600',
      warn:     'text-orange-600',
      bad:      'text-rose-600',
      pending:  'text-violet-700',
    };

    function kpi(label, value, tone, href = null) {
      const tag = href ? 'a' : 'div';
      const attrs = href ? `href="${href}"` : '';
      const hover = href ? 'transition hover:border-forest-200 hover:shadow-md' : '';

      return `
        <${tag} ${attrs} class="block rounded-xl border border-stone-200 bg-white p-4 shadow-sm ${hover}">
          <p class="text-xs font-medium uppercase tracking-wide text-stone-500">${label}</p>
          <p class="mt-2 font-display text-3xl font-semibold ${TONE[tone]}">${value}</p>
        </${tag}>`;
    }

    const RISK_TILE = {
      CRITICAL: 'border-rose-200   bg-rose-50    text-rose-700   hover:bg-rose-100',
      HIGH:     'border-orange-200 bg-orange-50  text-orange-700 hover:bg-orange-100',
      MEDIUM:   'border-gold-100   bg-gold-50    text-gold-600   hover:bg-gold-100',
      LOW:      'border-forest-200 bg-forest-50  text-forest-700 hover:bg-forest-100',
    };

    function riskTile(level, count) {
      return `
        <a href="/audits.html?risk_level=${level}"
           class="rounded-xl border p-4 transition ${RISK_TILE[level]}">
          <p class="text-xs font-bold uppercase tracking-wide">${level}</p>
          <p class="mt-2 font-display text-4xl font-semibold">${fmt.number(count)}</p>
        </a>`;
    }

    // min-w-0 matters: a grid item defaults to min-width:auto and refuses to
    // shrink below its canvas, which pushes the whole page into a sideways scroll.
    function panel(title, inner) {
      return `
        <div class="min-w-0 overflow-hidden rounded-xl border border-stone-200 bg-white p-5">
          <h3 class="mb-4 text-sm font-semibold text-stone-700">${title}</h3>
          ${inner}
        </div>`;
    }

    function feedRow(e) {
      return `
        <a href="/audits.html?search=${encodeURIComponent(e.audit_ref)}"
           class="flex items-start gap-3 px-5 py-3 transition hover:bg-stone-50">
          <div class="mt-0.5">${riskBadge(e.risk_level)}</div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm text-stone-700">${esc(e.description)}</p>
            <p class="mt-0.5 text-xs text-stone-400">
              <span class="font-mono">${e.audit_ref}</span>
              ${e.username ? ` · ${esc(e.username)}` : ''} · ${fmt.ago(e.created_at)}
            </p>
          </div>
        </a>`;
    }

    function userRow(u) {
      const tone = u.peak_risk >= 95 ? 'bad'
                 : u.peak_risk >= 70 ? 'warn'
                 : u.peak_risk >= 40 ? 'watch' : 'good';
      return `
        <a href="/timeline.html?user=${u.id}"
           class="flex items-center justify-between rounded-lg px-3 py-2 transition hover:bg-stone-50">
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-ink">${esc(u.full_name)}</p>
            <p class="text-xs text-stone-500">@${esc(u.username)} · ${fmt.number(u.events)} events</p>
          </div>
          <div class="ml-3 shrink-0 text-right">
            <p class="text-xs text-stone-400">peak risk</p>
            <p class="text-sm font-bold ${TONE[tone]}">${u.peak_risk}</p>
          </div>
        </a>`;
    }

    // ---------------------------------------------------------------- charts

    const GRID = 'rgba(28, 25, 23, 0.06)';
    const TICK = '#78716c';
    const FOREST = '#1f6f5c';
    const GOLDEN = '#c58b25';
    const ROSE = '#e11d48';

    const BASE_OPTIONS = {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { labels: { color: TICK, boxWidth: 12, font: { size: 11 } } },
      },
      scales: {
        x: { grid: { color: GRID }, ticks: { color: TICK, font: { size: 10 } } },
        y: { grid: { color: GRID }, ticks: { color: TICK, font: { size: 10 } }, beginAtZero: true },
      },
    };

    function drawCharts(d) {
      const days = d.login_trend.map((r) => fmt.date(r.day).slice(0, 6));

      charts.push(new Chart(document.getElementById('chart-logins'), {
        type: 'line',
        data: {
          labels: days,
          datasets: [
            {
              label: 'Successful',
              data: d.login_trend.map((r) => r.successful),
              borderColor: FOREST,
              backgroundColor: 'rgba(31, 111, 92, 0.10)',
              fill: true,
              tension: 0.3,
            },
            {
              label: 'Failed',
              data: d.login_trend.map((r) => r.failed),
              borderColor: ROSE,
              backgroundColor: 'rgba(225, 29, 72, 0.08)',
              fill: true,
              tension: 0.3,
            },
          ],
        },
        options: BASE_OPTIONS,
      }));

      charts.push(new Chart(document.getElementById('chart-volume'), {
        type: 'bar',
        data: {
          labels: d.transaction_trend.map((r) => fmt.date(r.day).slice(0, 6)),
          datasets: [{
            label: 'Volume (KES)',
            data: d.transaction_trend.map((r) => r.volume),
            backgroundColor: 'rgba(197, 139, 37, 0.35)',
            borderColor: GOLDEN,
            borderWidth: 1,
            borderRadius: 3,
          }],
        },
        options: BASE_OPTIONS,
      }));

      charts.push(new Chart(document.getElementById('chart-category'), {
        type: 'doughnut',
        data: {
          labels: d.category_breakdown.map((r) => r.category),
          datasets: [{
            data: d.category_breakdown.map((r) => r.count),
            backgroundColor: ['#1f6f5c', '#c58b25', '#e11d48', '#f97316', '#8ec7ad', '#7c3aed', '#a8a29e'],
            borderColor: '#ffffff',
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'right', labels: { color: TICK, boxWidth: 12, font: { size: 11 } } } },
        },
      }));

      charts.push(new Chart(document.getElementById('chart-types'), {
        type: 'bar',
        data: {
          labels: d.transactions_by_type.map((r) => fmt.label(r.type)),
          datasets: [{
            label: 'Count',
            data: d.transactions_by_type.map((r) => r.count),
            backgroundColor: 'rgba(31, 111, 92, 0.35)',
            borderColor: FOREST,
            borderWidth: 1,
            borderRadius: 3,
          }],
        },
        options: { ...BASE_OPTIONS, indexAxis: 'y', plugins: { legend: { display: false } } },
      }));
    }

    init();
  </script>
</body>
</html>
