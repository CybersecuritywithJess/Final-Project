<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Bank — Demo Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-ink antialiased">

  <main class="ml-60 p-8">
    <header class="mb-8">
      <h1 class="text-2xl font-bold">My Bank</h1>
    </header>

    <div id="content"></div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    const content = document.getElementById('content');
    let accounts = [];

    async function init() {
      const user = await mountShell('/bank.html', ['customer', 'admin']);
      if (!user) return;
      loading(content);
      await refresh();
    }

    let limitPercent = 30;

    async function refresh() {
      const [accountData, txnData] = await Promise.all([
        API.get('bank.php?action=accounts'),
        API.get('bank.php?action=transactions', { limit: 12 }),
      ]);

      accounts = accountData.accounts;
      limitPercent = accountData.limit_percent ?? limitPercent;
      render(accounts, txnData.transactions);
    }

    function render(accounts, transactions) {
      const checking = accounts.find((a) => a.type === 'checking');
      const savings = accounts.find((a) => a.type === 'savings');

      // One restricted account freezes the whole customer: every form is
      // disabled and the banner explains what to do about it.
      const restricted = accounts.some((a) => a.account_status === 'restricted');

      content.innerHTML = `
        ${restricted ? restrictedBanner() : ''}

        <!-- Balances -->
        <div class="mb-8 grid gap-4 sm:grid-cols-2">
          ${accountCard('Checking', checking, 'checking')}
          ${accountCard('Savings', savings, 'savings')}
        </div>

        <div class="grid gap-8 lg:grid-cols-5">

          <!-- Actions -->
          <section class="lg:col-span-2 space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-stone-500">Move money</h2>

            ${actionCard('deposit', 'Deposit', `
              <input type="number" id="deposit-amount" placeholder="Amount" min="1" step="any" class="${INPUT}" />
              <select id="deposit-account" class="${INPUT}">
                <option value="checking">Checking</option>
                <option value="savings">Savings</option>
              </select>
            `)}

            ${actionCard('withdraw', 'Withdraw', `
              <input type="number" id="withdraw-amount" placeholder="Amount" min="1" step="any" class="${INPUT}" />
              <select id="withdraw-account" class="${INPUT}">
                <option value="checking">Checking</option>
                <option value="savings">Savings</option>
              </select>
            `)}

            ${actionCard('transfer', 'Transfer', `
              <input type="number" id="transfer-amount" placeholder="Amount" min="1" step="any" class="${INPUT}" />
              <input id="transfer-to" placeholder="Recipient account number" class="${INPUT}" />
            `)}

            ${actionCard('pay', 'Pay a bill', `
              <input type="number" id="pay-amount" placeholder="Amount" min="1" step="any" class="${INPUT}" />
              <input id="pay-biller" placeholder="Biller (e.g. KPLC Prepaid)" class="${INPUT}" />
              <select id="pay-kind" class="${INPUT}">
                <option value="bill_payment">Bill payment</option>
                <option value="airtime">Airtime</option>
              </select>
            `)}
          </section>

          <!-- Statement -->
          <section class="lg:col-span-3">
            <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-stone-500">
              Recent transactions
            </h2>
            <div class="overflow-hidden rounded-xl border border-stone-200 bg-white">
              ${transactions.length === 0
                ? `<p class="p-8 text-center text-sm text-stone-400">No transactions yet.</p>`
                : `<table class="w-full text-sm">
                     <thead class="border-b border-stone-200 bg-stone-50 text-left text-xs uppercase tracking-wide text-stone-500">
                       <tr>
                         <th class="px-4 py-3 font-medium">Reference</th>
                         <th class="px-4 py-3 font-medium">Type</th>
                         <th class="px-4 py-3 font-medium text-right">Amount</th>
                         <th class="px-4 py-3 font-medium">Status</th>
                         <th class="px-4 py-3 font-medium">When</th>
                       </tr>
                     </thead>
                     <tbody class="divide-y divide-stone-200">
                       ${transactions.map(txnRow).join('')}
                     </tbody>
                   </table>`}
            </div>
          </section>
        </div>`;

      wireActions();
    }

    const INPUT = 'w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm ' +
                  'text-ink placeholder-stone-400 outline-none focus:border-forest-700 focus:ring-1 focus:ring-forest-700';

    /** Shown when the limit controls have suspended the customer's transactions. */
    function restrictedBanner() {
      return `
        <div class="mb-6 rounded-xl border border-rose-200 bg-rose-50 p-5">
          <h2 class="font-display text-lg font-semibold text-rose-800">Account Temporarily Closed</h2>
          <p class="mt-2 text-sm leading-relaxed text-rose-700/90">
            Your account has been restricted due to multiple attempts to exceed your permitted
            transaction limit. Your balance is unchanged and your history is intact.
          </p>
          <p class="mt-2 text-sm leading-relaxed text-rose-700/90">
            Please visit your nearest bank branch for verification and account reactivation.
          </p>
        </div>`;
    }

    /** Checking is the everyday account (green); savings is the held one (gold). */
    function accountCard(title, account, kind) {
      if (!account) return '';

      const restricted = account.account_status === 'restricted';

      const skin = restricted
        ? 'from-rose-50 to-white border-rose-200'
        : kind === 'savings'
          ? 'from-gold-50 to-white border-gold-100'
          : 'from-forest-50 to-white border-forest-200';
      const chip = kind === 'savings'
        ? 'bg-gold-100 text-gold-600'
        : 'bg-forest-100 text-forest-800';

      // Percentages of a moving balance, so the numbers are always the ones the
      // server will actually enforce on the next transaction.
      const used = Number(account.used_today || 0);
      const limit = Number(account.daily_limit || 0);
      const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;

      const limitPanel = !account.funded
        ? `<p class="mt-4 border-t border-stone-200/70 pt-3 text-xs leading-relaxed text-stone-500">
             Make an initial deposit to activate this account. Your daily transaction limit will be
             ${limitPercent}% of your balance.
           </p>`
        : `<div class="mt-4 border-t border-stone-200/70 pt-3">
             <div class="flex items-baseline justify-between text-xs">
               <span class="text-stone-500">Daily limit (${limitPercent}% of balance)</span>
               <span class="font-semibold text-stone-700">${fmt.money(limit)}</span>
             </div>
             <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-stone-200">
               <div class="h-full rounded-full ${pct >= 100 ? 'bg-rose-500' : pct >= 75 ? 'bg-gold-500' : 'bg-forest-600'}"
                    style="width: ${pct}%"></div>
             </div>
             <div class="mt-1.5 flex items-baseline justify-between text-xs text-stone-500">
               <span>Used today ${fmt.money(used)}</span>
               <span>${fmt.money(account.remaining_today || 0)} left</span>
             </div>
           </div>`;

      return `
        <div class="rounded-xl border bg-gradient-to-br p-5 shadow-sm ${skin}">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">${title}</p>
              <p class="mt-2 font-display text-3xl font-semibold text-ink">${fmt.money(account.balance)}</p>
            </div>
            <div class="text-right">
              <span class="rounded-lg px-2 py-1 font-mono text-xs font-semibold ${chip}">
                ${account.account_number}
              </span>
              ${restricted
                ? `<p class="mt-2 text-[11px] font-bold uppercase tracking-wide text-rose-700">Restricted</p>`
                : ''}
            </div>
          </div>
          ${limitPanel}
        </div>`;
    }

    /**
     * The "Transaction Declined" dialog. Every figure comes from the server's
     * response, so what the customer reads is exactly what was enforced.
     */
    function declinedModal(d) {
      const wrap = document.createElement('div');
      wrap.className = 'fixed inset-0 z-50 grid place-items-center bg-stone-900/40 p-4';
      wrap.innerHTML = `
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
          <h2 class="font-display text-xl font-semibold text-rose-700">Transaction Declined</h2>
          <p class="mt-3 text-sm leading-relaxed text-stone-600">
            You are unable to complete this transaction because it exceeds your daily
            transaction limit.
          </p>

          <dl class="mt-5 space-y-0 divide-y divide-stone-200 text-sm">
            <div class="flex justify-between py-2">
              <dt class="text-stone-500">Your daily limit</dt>
              <dd class="font-semibold text-ink">${fmt.money(d.daily_limit)}</dd>
            </div>
            <div class="flex justify-between py-2">
              <dt class="text-stone-500">Already used today</dt>
              <dd class="text-stone-700">${fmt.money(d.used_today)}</dd>
            </div>
            <div class="flex justify-between py-2">
              <dt class="text-stone-500">Remaining today</dt>
              <dd class="font-semibold text-forest-800">${fmt.money(d.remaining)}</dd>
            </div>
            <div class="flex justify-between py-2">
              <dt class="text-stone-500">Amount attempted</dt>
              <dd class="font-semibold text-rose-700">${fmt.money(d.requested)}</dd>
            </div>
          </dl>

          ${d.restricted
            ? `<p class="mt-4 rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700 ring-1 ring-rose-200">
                 This was attempt ${d.violations} of ${d.violations_allowed}. Your account has now been
                 restricted — please visit your nearest branch for verification and reactivation.
               </p>`
            : `<p class="mt-4 text-sm text-stone-500">
                 Please reduce the amount and try again. This was attempt ${d.violations} of
                 ${d.violations_allowed}; after ${d.violations_allowed}, the account is restricted.
               </p>`}

          <button id="declined-close"
                  class="mt-5 w-full rounded-lg bg-forest-800 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-forest-900">
            Close
          </button>
        </div>`;

      document.body.appendChild(wrap);
      const close = () => wrap.remove();
      wrap.querySelector('#declined-close').addEventListener('click', close);
      wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    }

    function actionCard(id, title, fields) {
      return `
        <form data-action="${id}" class="space-y-3 rounded-xl border border-stone-200 bg-white p-4 shadow-sm">
          <h3 class="text-sm font-semibold text-ink">${title}</h3>
          ${fields}
          <button type="submit"
                  class="w-full rounded-lg bg-forest-800 px-3 py-2 text-sm font-semibold text-white transition hover:bg-forest-900 disabled:opacity-50">
            ${title}
          </button>
        </form>`;
    }

    function txnRow(t) {
      return `
        <tr class="transition hover:bg-stone-50">
          <td class="px-4 py-3 font-mono text-xs text-stone-600">${t.reference}</td>
          <td class="px-4 py-3 text-stone-700">${fmt.label(t.type)}</td>
          <td class="px-4 py-3 text-right font-medium text-ink">${fmt.money(t.amount)}</td>
          <td class="px-4 py-3">${statusBadge(t.status)}</td>
          <td class="px-4 py-3 text-xs text-stone-500">${fmt.dateTime(t.created_at)}</td>
        </tr>`;
    }

    // ---------------------------------------------------------------- actions

    function wireActions() {
      const restricted = accounts.some((a) => a.account_status === 'restricted');

      document.querySelectorAll('form[data-action]').forEach((form) => {
        // A restricted account cannot move money at all — including deposits.
        if (restricted) {
          form.querySelectorAll('input, select, button').forEach((el) => { el.disabled = true; });
          form.classList.add('opacity-50');
          return;
        }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const button = form.querySelector('button');
          const original = button.textContent;
          button.disabled = true;
          button.textContent = 'Working…';

          try {
            const result = await submit(form.dataset.action);

            // Tell the customer plainly when the audit system flagged them.
            if (result?.flagged) {
              const titles = result.alerts.map((a) => a.title).join(', ');
              toast(`⚠️ Flagged for review: <strong>${esc(titles)}</strong>`, 'alert');
            } else {
              toast('Done.', 'success');
            }

            await refresh();
          } catch (error) {
            // The security controls carry their reasons on the error, so show the
            // customer the actual numbers rather than a bare message.
            if (error.code === 'LIMIT_EXCEEDED') {
              declinedModal(error);
              await refresh();
              return;
            }

            if (error.code === 'ACCOUNT_RESTRICTED') {
              await refresh();   // repaints with the banner and disabled forms
              return;
            }

            toast(esc(error.message), 'error');
            button.disabled = false;
            button.textContent = original;
          }
        });
      });
    }

    function submit(action) {
      const value = (id) => document.getElementById(id).value;

      switch (action) {
        case 'deposit':
          return API.post('bank.php?action=deposit', {
            amount: value('deposit-amount'),
            account_type: value('deposit-account'),
          });

        case 'withdraw':
          return API.post('bank.php?action=withdraw', {
            amount: value('withdraw-amount'),
            account_type: value('withdraw-account'),
          });

        case 'transfer':
          return API.post('bank.php?action=transfer', {
            amount: value('transfer-amount'),
            to_account_number: value('transfer-to'),
          });

        case 'pay':
          return API.post('bank.php?action=pay', {
            amount: value('pay-amount'),
            biller: value('pay-biller'),
            kind: value('pay-kind'),
          });
      }
    }

    init();
  </script>
</body>
</html>
