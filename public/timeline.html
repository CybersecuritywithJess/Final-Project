<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Timeline — Audit Tracking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/theme.js"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-ink antialiased">

  <main class="ml-60 p-8">
    <a href="/dashboard.html" class="mb-6 inline-block text-sm text-stone-500 transition hover:text-ink">
      Back to dashboard
    </a>
    <div id="content"></div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/assistant-widget.js"></script>
  <script>
    const content = document.getElementById('content');
    const userId = new URLSearchParams(location.search).get('user');

    async function init() {
      const user = await mountShell('/timeline.html', ['auditor', 'admin']);
      if (!user) return;

      if (!userId) {
        window.location.href = '/dashboard.html';
        return;
      }

      loading(content, 'Reconstructing the timeline…');
      const data = await API.get('audit.php?action=timeline', { user: userId });
      render(data);
    }

    function render(d) {
      const u = d.user;
      const riskPanel = d.risk_score >= 95 ? 'border-rose-200 bg-rose-50 text-rose-700'
                      : d.risk_score >= 70 ? 'border-orange-200 bg-orange-50 text-orange-700'
                      : d.risk_score >= 40 ? 'border-gold-100 bg-gold-50 text-gold-600'
                      : 'border-forest-200 bg-forest-50 text-forest-700';

      // Newest first reads better for an investigator arriving at a case.
      const events = [...d.events].reverse();

      content.innerHTML = `
        <header class="mb-8">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold">${esc(u.full_name)}</h1>
              <p class="mt-1 text-sm text-stone-500">
                @${esc(u.username)} · ${esc(u.email)} ${u.phone ? `· ${esc(u.phone)}` : ''}
              </p>
              <div class="mt-3 flex flex-wrap items-center gap-2">
                ${statusBadge(u.status)}
                <span class="rounded-full bg-stone-100 px-2 py-0.5 text-xs capitalize text-stone-600">${u.role}</span>
                <span class="text-xs text-stone-400">Customer since ${fmt.date(u.created_at)}</span>
              </div>
            </div>

            <div class="rounded-xl border px-6 py-4 text-center ${riskPanel}">
              <p class="text-xs font-semibold uppercase tracking-wide">Risk score</p>
              <p class="mt-1 font-display text-4xl font-semibold">${d.risk_score}</p>
              <p class="text-[11px] opacity-70">peak, last 30 days</p>
            </div>
          </div>
        </header>

        <div class="grid gap-6 lg:grid-cols-3">

          <!-- Timeline -->
          <section class="lg:col-span-2">
            <h2 class="mb-4 text-sm font-semibold uppercase tracking-wide text-stone-500">
              Activity timeline (${events.length} events)
            </h2>

            <div class="relative space-y-1 border-l border-stone-200 pl-6">
              ${events.map(timelineRow).join('')}
            </div>
          </section>

          <!-- Sidebar -->
          <aside class="space-y-6">

            <section class="rounded-xl border border-stone-200 bg-white p-5">
              <h2 class="mb-4 text-sm font-semibold text-ink">Accounts</h2>
              <div class="space-y-3">
                ${d.accounts.map((a) => `
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-sm capitalize text-stone-700">${a.type}</p>
                      <p class="font-mono text-xs text-stone-400">${a.account_number}</p>
                    </div>
                    <p class="text-sm font-semibold text-ink">${fmt.money(a.balance)}</p>
                  </div>`).join('')}
              </div>
            </section>

            <section class="rounded-xl border border-stone-200 bg-white p-5">
              <h2 class="mb-4 text-sm font-semibold text-ink">
                Alerts (${d.alerts.length})
              </h2>
              ${d.alerts.length === 0
                ? `<p class="text-sm text-stone-400">Nothing raised against this customer.</p>`
                : `<div class="space-y-2">
                     ${d.alerts.map((a) => `
                       <a href="/alert.html?id=${a.id}"
                          class="block rounded-lg border border-stone-200 p-3 transition hover:bg-stone-100">
                         <div class="mb-1 flex items-center gap-2">
                           ${riskBadge(a.risk_level)}
                           ${statusBadge(a.status)}
                         </div>
                         <p class="text-sm text-stone-700">${esc(a.title)}</p>
                         <p class="mt-0.5 text-xs text-stone-400">${fmt.ago(a.created_at)}</p>
                       </a>`).join('')}
                   </div>`}
            </section>

            <section class="rounded-xl border border-stone-200 bg-white p-5">
              <h2 class="mb-4 text-sm font-semibold text-ink">
                Known devices (${d.devices.length})
              </h2>
              ${d.devices.length === 0
                ? `<p class="text-sm text-stone-400">No devices recorded.</p>`
                : `<div class="space-y-3">
                     ${d.devices.map((dev) => `
                       <div class="text-sm">
                         <p class="text-stone-700">${esc(dev.browser)} on ${esc(dev.os)}</p>
                         <p class="text-xs text-stone-400">
                           ${esc(dev.device_type)} · ${esc(dev.last_ip)} · ${esc(dev.last_country)}
                         </p>
                         <p class="text-xs text-stone-300">Last seen ${fmt.ago(dev.last_seen)}</p>
                       </div>`).join('')}
                   </div>`}
            </section>
          </aside>
        </div>`;
    }

    function timelineRow(e) {
      const dot = {
        CRITICAL: 'bg-rose-500',
        HIGH: 'bg-orange-500',
        MEDIUM: 'bg-amber-500',
        LOW: 'bg-stone-300',
      }[e.risk_level];

      // Anything above LOW deserves to stand out when scrolling a long history.
      const emphasis = e.risk_level === 'LOW'
        ? 'text-stone-600'
        : 'text-ink font-medium';

      return `
        <div class="relative py-2.5">
          <span class="absolute -left-[31px] top-4 h-2.5 w-2.5 rounded-full ${dot} ring-4 ring-white"></span>

          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
              <p class="text-sm ${emphasis}">${esc(e.description)}</p>
              <p class="mt-0.5 text-xs text-stone-400">
                <span class="font-mono">${e.audit_ref}</span>
                · ${esc(e.city || '')}, ${esc(e.country || '')}
                · ${esc(e.ip_address || '')}
                ${e.browser ? ` · ${esc(e.browser)}` : ''}
              </p>
            </div>
            <div class="shrink-0 text-right">
              <p class="text-xs text-stone-500">${fmt.dateTime(e.created_at)}</p>
              ${e.risk_level !== 'LOW' ? `<div class="mt-1">${riskBadge(e.risk_level)}</div>` : ''}
            </div>
          </div>
        </div>`;
    }

    init();
  </script>
</body>
</html>
