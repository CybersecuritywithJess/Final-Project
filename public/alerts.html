<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraud Alerts — Audit Tracking System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">

  <main class="ml-60 p-8">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Fraud Alerts</h1>
      <p class="mt-1 text-sm text-slate-500">
        Raised automatically by the detection rules. Work them top-down.
      </p>
    </header>

    <div class="mb-6 flex flex-wrap gap-2" id="tabs"></div>

    <div id="content"></div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    const content = document.getElementById('content');
    let filter = { status: '', risk_level: '' };

    const TABS = [
      { label: 'Open', status: 'new' },
      { label: 'Investigating', status: 'under_investigation' },
      { label: 'Confirmed fraud', status: 'confirmed_fraud' },
      { label: 'False positives', status: 'false_positive' },
      { label: 'Resolved', status: 'resolved' },
      { label: 'All', status: '' },
    ];

    async function init() {
      const user = await mountShell('/alerts.html', ['auditor', 'admin']);
      if (!user) return;

      const params = new URLSearchParams(location.search);
      if (params.has('risk')) filter.risk_level = params.get('risk');
      if (params.has('status')) filter.status = params.get('status');

      renderTabs();
      await load();
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map((tab) => {
        const active = tab.status === filter.status;
        const classes = active
          ? 'bg-sky-500/10 text-sky-300 ring-1 ring-sky-500/30'
          : 'text-slate-400 ring-1 ring-slate-800 hover:bg-slate-800 hover:text-slate-200';
        return `<button data-status="${tab.status}"
                        class="tab rounded-lg px-3 py-1.5 text-sm font-medium transition ${classes}">
                  ${tab.label}
                </button>`;
      }).join('') + (filter.risk_level ? `
        <button id="clear-risk"
                class="ml-2 rounded-lg bg-rose-500/10 px-3 py-1.5 text-sm font-medium text-rose-400 ring-1 ring-rose-500/30">
          Risk: ${filter.risk_level} ✕
        </button>` : '');

      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => {
          filter.status = button.dataset.status;
          renderTabs();
          load();
        });
      });

      document.getElementById('clear-risk')?.addEventListener('click', () => {
        filter.risk_level = '';
        renderTabs();
        load();
      });
    }

    async function load() {
      loading(content);
      const { alerts } = await API.get('audit.php?action=alerts', filter);
      render(alerts);
    }

    function render(alerts) {
      if (alerts.length === 0) {
        content.innerHTML = `
          <div class="rounded-xl border border-slate-800 bg-slate-900 p-12 text-center">
            <p class="text-3xl">✅</p>
            <p class="mt-3 text-sm text-slate-500">No alerts here. The queue is clear.</p>
          </div>`;
        return;
      }

      content.innerHTML = `<div class="space-y-3">${alerts.map(card).join('')}</div>`;
    }

    function card(a) {
      const accent = {
        CRITICAL: 'border-l-rose-500',
        HIGH: 'border-l-orange-500',
        MEDIUM: 'border-l-amber-500',
        LOW: 'border-l-emerald-500',
      }[a.risk_level];

      return `
        <a href="/alert.html?id=${a.id}"
           class="block rounded-xl border border-slate-800 border-l-4 ${accent} bg-slate-900 p-5 transition hover:bg-slate-800/50">
          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
              <div class="mb-1.5 flex flex-wrap items-center gap-2">
                ${riskBadge(a.risk_level)}
                ${statusBadge(a.status)}
                <span class="font-mono text-xs text-slate-600">${a.alert_ref}</span>
              </div>

              <h3 class="text-sm font-semibold text-slate-100">${esc(a.title)}</h3>
              <p class="mt-1 text-sm leading-relaxed text-slate-400">${esc(a.description)}</p>

              <div class="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-600">
                ${a.username ? `<span>Customer: <span class="text-slate-400">${esc(a.full_name)}</span> (@${esc(a.username)})</span>` : ''}
                <span>Rule: <code class="text-slate-500">${a.rule_key}</code></span>
                <span>${fmt.ago(a.created_at)}</span>
                ${a.assignee_name ? `<span>Assigned: <span class="text-slate-400">${esc(a.assignee_name)}</span></span>` : ''}
              </div>
            </div>

            <span class="shrink-0 text-slate-600">→</span>
          </div>
        </a>`;
    }

    init();
  </script>
</body>
</html>
